<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/index.global.min.css" rel="stylesheet">

  <style>
    body { background: #f5f7fb; }
    .login-wrap { max-width: 470px; margin: 8vh auto; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: 250px;
      padding: 20px; color: white; background: #253047;
      overflow-y: auto;
    }
    .sidebar a {
      display: block; padding: 10px 12px; margin: 4px 0;
      color: #dbe2ef; text-decoration: none; border-radius: 8px;
    }
    .sidebar a:hover, .sidebar a.active { background: #394966; color: white; }
    .main { margin-left: 250px; padding: 24px; }
    .hidden { display: none !important; }
    #calendar { min-height: 600px; }
    @media (max-width: 768px) {
      .sidebar { position: static; width: 100%; min-height: auto; }
      .main { margin-left: 0; padding: 16px; }
      #calendar { min-height: 450px; }
    }
  </style>
</head>

<body>
  <section id="loginView" class="login-wrap">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h2 class="text-center mb-4">🔒 เข้าสู่ระบบ</h2>
        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" class="form-control form-control-lg" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
          </div>
          <button id="loginButton" class="btn btn-primary btn-lg w-100">เข้าสู่ระบบ</button>
          <div id="loginError" class="text-danger mt-3" role="alert"></div>
        </form>
      </div>
    </div>
  </section>

  <section id="appView" class="hidden">
    <nav class="sidebar">
      <h4 class="text-center mb-4">My Dashboard</h4>
      <a href="#" class="active" data-tab="dashboard">หน้าแรก</a>
      <a href="#" data-tab="calendar">ปฏิทิน</a>
      <a href="#" data-tab="categories">หมวดหมู่</a>
      <a href="#" data-tab="menus">จัดการเมนู</a>
      <a href="#" data-tab="lineoa">ตั้งค่า LINE OA</a>
      <a href="#" id="logoutButton" class="text-warning mt-4">ออกจากระบบ</a>
      <hr>
      <div id="menuLinks"></div>
    </nav>

    <main class="main">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 id="pageTitle">หน้าแรก</h2>
        <select id="language" class="form-select w-auto" aria-label="เลือกภาษา">
          <option value="th">ไทย</option>
          <option value="en">English</option>
        </select>
      </div>

      <section id="tab-dashboard" class="content-tab">
        <div class="row g-3">
          <div class="col-md-4">
            <div class="card shadow-sm"><div class="card-body">
              <div>งานทั้งหมด</div><h3 id="eventCount">0</h3>
            </div></div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm"><div class="card-body">
              <div>หมวดหมู่</div><h3 id="categoryCount">0</h3>
            </div></div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm"><div class="card-body">
              <div>เมนู</div><h3 id="menuCount">0</h3>
            </div></div>
          </div>
        </div>
      </section>

      <section id="tab-calendar" class="content-tab hidden">
        <div class="card border-0 shadow-sm p-3"><div id="calendar"></div></div>
      </section>

      <section id="tab-categories" class="content-tab hidden">
        <div class="card border-0 shadow-sm p-4">
          <h4>จัดการหมวดหมู่</h4>
          <form id="categoryForm" class="row g-2 my-2">
            <div class="col-sm-6">
              <input id="categoryName" class="form-control" placeholder="ชื่อหมวดหมู่" required>
            </div>
            <div class="col-sm-3">
              <input id="categoryColor" type="color" class="form-control form-control-color" value="#563d7c">
            </div>
            <div class="col-sm-3">
              <button class="btn btn-primary w-100">เพิ่มหมวดหมู่</button>
            </div>
          </form>
          <div id="categoryList"></div>
        </div>
      </section>

      <section id="tab-menus" class="content-tab hidden">
        <div class="card border-0 shadow-sm p-4">
          <h4>จัดการเมนู</h4>
          <form id="menuForm" class="row g-2 my-2">
            <div class="col-md-4">
              <input id="menuName" class="form-control" placeholder="ชื่อเมนู" required>
            </div>
            <div class="col-md-6">
              <input id="menuUrl" type="url" class="form-control" placeholder="https://example.com" required>
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary w-100">เพิ่มเมนู</button>
            </div>
          </form>
          <div id="menuList"></div>
        </div>
      </section>

      <section id="tab-lineoa" class="content-tab hidden">
        <div class="card border-0 shadow-sm p-4" style="max-width:650px">
          <h4>ตั้งค่า LINE OA</h4>
          <p class="text-muted">
            Token จะถูกเก็บใน Apps Script และจะไม่ถูกส่งกลับมาแสดงบนหน้านี้
          </p>
          <form id="lineForm">
            <div class="mb-3">
              <label for="lineToken" class="form-label">Channel Access Token</label>
              <textarea id="lineToken" class="form-control" rows="3"
                placeholder="ว่างไว้เพื่อเก็บ Token เดิม"></textarea>
            </div>
            <div class="mb-3">
              <label for="lineRecipient" class="form-label">LINE User ID / Group ID</label>
              <input id="lineRecipient" class="form-control">
            </div>
            <div id="lineStatus" class="small text-muted mb-3"></div>
            <button class="btn btn-primary">บันทึกการตั้งค่า</button>
          </form>
        </div>
      </section>

      <div id="notice" class="mt-3" role="status"></div>
    </main>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/timegrid@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales-all.global.min.js"></script>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwBB0jHWJm8aCDlPGWqGJpc567tGZKoenSzJ3Q3hLk7HUR0bE3xcNqGRa1Ay3aaD-m6Rg/exec';
    let sessionToken = '';
    let calendar = null;
    let appData = { events: [], categories: [], menus: [] };

    async function api(action, data = {}) {
      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, token: sessionToken, ...data })
      });

      const result = await response.json();
      if (result.status !== 'success') {
        throw new Error(result.message || 'เกิดข้อผิดพลาด');
      }
      return result;
    }

    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('loginButton');
      const errorBox = document.getElementById('loginError');
      button.disabled = true;
      errorBox.textContent = '';

      try {
        const result = await api('login', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        });

        sessionToken = result.token;
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('appView').classList.remove('hidden');

        await loadData();
        if (result.role === 'admin') {
          await loadLineSettings();
        } else {
          document.querySelector('[data-tab="lineoa"]').classList.add('hidden');
          document.querySelector('[data-tab="categories"]').classList.add('hidden');
          document.querySelector('[data-tab="menus"]').classList.add('hidden');
        }
      } catch (error) {
        errorBox.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    document.querySelectorAll('.sidebar [data-tab]').forEach(link => {
      link.addEventListener('click', event => {
        event.preventDefault();
        const tab = link.dataset.tab;
        document.querySelectorAll('.content-tab').forEach(el => el.classList.add('hidden'));
        document.getElementById('tab-' + tab).classList.remove('hidden');
        document.querySelectorAll('.sidebar [data-tab]').forEach(el => el.classList.remove('active'));
        link.classList.add('active');

        document.getElementById('pageTitle').textContent =
          link.textContent.trim();

        if (tab === 'calendar' && calendar) {
          setTimeout(() => calendar.updateSize(), 50);
        }
      });
    });

    document.getElementById('logoutButton').addEventListener('click', async event => {
      event.preventDefault();
      try { await api('logout'); } catch (_) {}
      sessionToken = '';
      location.reload();
    });

    document.getElementById('language').addEventListener('change', event => {
      if (calendar) calendar.setOption('locale', event.target.value);
    });

    async function loadData() {
      appData = await api('getData');
      renderData();
      renderCalendar();
    }

    function renderData() {
      document.getElementById('eventCount').textContent = appData.events.length;
      document.getElementById('categoryCount').textContent = appData.categories.length;
      document.getElementById('menuCount').textContent = appData.menus.length;

      document.getElementById('categoryList').innerHTML =
        appData.categories.map(item => `
          <div class="d-flex align-items-center justify-content-between border-bottom py-2">
            <span><i class="fa-solid fa-circle" style="color:${escapeAttr(item.color)}"></i>
              ${escapeHtml(item.name)}</span>
            <button class="btn btn-sm btn-outline-danger"
              onclick="deleteCategory('${escapeAttr(item.id)}')">ลบ</button>
          </div>`).join('') || '<p class="text-muted">ยังไม่มีหมวดหมู่</p>';

      document.getElementById('menuList').innerHTML =
        appData.menus.map(item => `
          <div class="d-flex align-items-center justify-content-between border-bottom py-2">
            <a href="${escapeAttr(item.url)}" target="_blank" rel="noopener">
              ${escapeHtml(item.name)}</a>
            <button class="btn btn-sm btn-outline-danger"
              onclick="deleteMenu('${escapeAttr(item.id)}')">ลบ</button>
          </div>`).join('') || '<p class="text-muted">ยังไม่มีเมนู</p>';

      document.getElementById('menuLinks').innerHTML =
        appData.menus.map(item => `
          <a href="${escapeAttr(item.url)}" target="_blank" rel="noopener">
            ↗ ${escapeHtml(item.name)}</a>`).join('');
    }

    function renderCalendar() {
      const calendarEl = document.getElementById('calendar');
      if (calendar) calendar.destroy();

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: document.getElementById('language').value,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        selectable: true,
        events: appData.events.map(item => ({
          id: item.id,
          title: item.category ? `${item.title} · ${item.category}` : item.title,
          start: item.start,
          end: item.end || null,
          allDay: item.allDay
        })),
        select: async info => {
          const title = prompt('ชื่องาน / Event title:');
          if (!title) return;

          const category = prompt('หมวดหมู่ (เว้นว่างได้):', '') || '';
          try {
            await api('saveEvent', {
              title,
              start: info.startStr,
              end: info.endStr || '',
              allDay: info.allDay,
              category
            });
            await loadData();
            showNotice('เพิ่มงานเรียบร้อย', 'success');
          } catch (error) {
            showNotice(error.message, 'danger');
          }
          calendar.unselect();
        },
        eventClick: async info => {
          if (!confirm('ต้องการลบรายการนี้หรือไม่?')) return;
          try {
            await api('deleteEvent', { id: info.event.id });
            await loadData();
            showNotice('ลบรายการเรียบร้อย', 'success');
          } catch (error) {
            showNotice(error.message, 'danger');
          }
        }
      });

      calendar.render();
    }

    document.getElementById('categoryForm').addEventListener('submit', async event => {
      event.preventDefault();
      try {
        await api('saveCategory', {
          name: document.getElementById('categoryName').value,
          color: document.getElementById('categoryColor').value
        });
        event.target.reset();
        document.getElementById('categoryColor').value = '#563d7c';
        await loadData();
        showNotice('เพิ่มหมวดหมู่เรียบร้อย', 'success');
      } catch (error) {
        showNotice(error.message, 'danger');
      }
    });

    document.getElementById('menuForm').addEventListener('submit', async event => {
      event.preventDefault();
      try {
        await api('saveMenu', {
          name: document.getElementById('menuName').value,
          url: document.getElementById('menuUrl').value
        });
        event.target.reset();
        await loadData();
        showNotice('เพิ่มเมนูเรียบร้อย', 'success');
      } catch (error) {
        showNotice(error.message, 'danger');
      }
    });

    document.getElementById('lineForm').addEventListener('submit', async event => {
      event.preventDefault();
      try {
        const result = await api('saveLineSettings', {
          channelAccessToken: document.getElementById('lineToken').value,
          recipient: document.getElementById('lineRecipient').value
        });
        document.getElementById('lineToken').value = '';
        document.getElementById('lineStatus').textContent =
          result.configured ? 'มี Token บันทึกอยู่ใน Apps Script' : 'ยังไม่ได้ตั้งค่า Token';
        showNotice('บันทึกการตั้งค่าเรียบร้อย', 'success');
      } catch (error) {
        showNotice(error.message, 'danger');
      }
    });

    async function loadLineSettings() {
      try {
        const result = await api('getLineSettings');
        document.getElementById('lineRecipient').value = result.recipient || '';
        document.getElementById('lineStatus').textContent =
          result.configured ? 'มี Token บันทึกอยู่ใน Apps Script' : 'ยังไม่ได้ตั้งค่า Token';
      } catch (error) {
        showNotice(error.message, 'danger');
      }
    }

    async function deleteCategory(id) {
      if (!confirm('ต้องการลบหมวดหมู่นี้หรือไม่?')) return;
      try {
        await api('deleteCategory', { id });
        await loadData();
      } catch (error) { showNotice(error.message, 'danger'); }
    }

    async function deleteMenu(id) {
      if (!confirm('ต้องการลบเมนูนี้หรือไม่?')) return;
      try {
        await api('deleteMenu', { id });
        await loadData();
      } catch (error) { showNotice(error.message, 'danger'); }
    }

    function showNotice(message, type) {
      const box = document.getElementById('notice');
      box.className = `alert alert-${type}`;
      box.textContent = message;
      setTimeout(() => {
        box.textContent = '';
        box.className = '';
      }, 4000);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
  </script>
</body>
</html>
