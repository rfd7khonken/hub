<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #343a40; color: #fff; position: fixed; width: 250px; }
        .sidebar a { color: #cfd2d6; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background: #495057; color: #fff; }
        .main-content { margin-left: 250px; padding: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div id="login-container" class="container mt-5" style="max-width: 400px;">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4"><i class="fas fa-lock"></i> เข้าสู่ระบบ</h3>
            <div class="mb-3">
                <label>Username</label>
                <input type="text" id="username" class="form-control">
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="password" class="form-control">
            </div>
            <button onclick="login()" class="btn btn-primary w-100">Login</button>
        </div>
    </div>

    <!-- Dashboard App Section -->
    <div id="app-container" class="hidden">
        <!-- Sidebar -->
        <div class="sidebar p-3">
            <h4 class="text-center mb-4">My Dashboard</h4>
            <a href="#" onclick="switchTab('dashboard')" class="active"><i class="fas fa-home me-2"></i> หน้าแรก</a>
            <a href="#" onclick="switchTab('calendar')"><i class="fas fa-calendar-alt me-2"></i> ปฏิทิน</a>
            <a href="#" onclick="switchTab('categories')"><i class="fas fa-tags me-2"></i> จัดการหมวดหมู่</a>
            <a href="#" onclick="switchTab('lineoa')"><i class="fab fa-line me-2"></i> ตั้งค่า LINE OA</a>
            <a href="#" onclick="location.reload()" class="text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> ออกจากระบบ</a>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Nav -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 id="page-title">หน้าแรก</h2>
                <div>
                    <select id="langSwitch" class="form-select form-select-sm" onchange="changeLanguage(this.value)">
                        <option value="th">ไทย</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>

            <!-- Tab: Dashboard -->
            <div id="tab-dashboard" class="content-tab">
                <div class="row">
                    <div class="col-md-4 mb-3"><div class="card p-3 shadow-sm"><h5>งานทั้งหมด</h5><h3>0</h3></div></div>
                    <div class="col-md-4 mb-3"><div class="card p-3 shadow-sm"><h5>หมวดหมู่</h5><h3>0</h3></div></div>
                    <div class="col-md-4 mb-3"><div class="card p-3 shadow-sm"><h5>สถานะ LINE OA</h5><span class="badge bg-success">เชื่อมต่อแล้ว</span></div></div>
                </div>
            </div>

            <!-- Tab: Calendar -->
            <div id="tab-calendar" class="content-tab hidden">
                <div class="card p-3 shadow-sm">
                    <div id="calendar"></div>
                </div>
            </div>

            <!-- Tab: Categories -->
            <div id="tab-categories" class="content-tab hidden">
                <div class="card p-3 shadow-sm">
                    <h4>จัดการหมวดหมู่</h4>
                    <div class="input-group mb-3 mt-3" style="max-width: 400px;">
                        <input type="text" id="catName" class="form-control" placeholder="ชื่อหมวดหมู่">
                        <input type="color" id="catColor" class="form-control form-control-color" value="#563d7c">
                        <button class="btn btn-success" onclick="saveCategory()">เพิ่ม</button>
                    </div>
                </div>
            </div>

            <!-- Tab: LINE OA Settings -->
            <div id="tab-lineoa" class="content-tab hidden">
                <div class="card p-3 shadow-sm" style="max-width: 600px;">
                    <h4>ตั้งค่าการเชื่อมต่อ LINE OA</h4>
                    <div class="mb-3 mt-3">
                        <label>Channel Access Token</label>
                        <textarea id="lineToken" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label>LINE User ID / Group ID สำหรับแจ้งเตือน</label>
                        <input type="text" id="NFCpIU9uM2qJE2qyFgdWsWl9sTB8+6m7Va0cFXcbKJJjhZz9kCbdv7FE5mqshX52YUdV++ETfH8TYHBpQYBCr37gFwXGJixl8goZzwH61V/N3KnG97CFymh2YNEfDknWOrFvPLwsQ+t7Vr3YVmHyGwdB04t89/1O/w1cDnyilFU=" class="form-control">
                    </div>
                    <button class="btn btn-primary" onclick="alert('บันทึกข้อมูลเรียบร้อย')">บันทึกการตั้งค่า</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core/locales/th.global.min.js'></script>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzVl_r5UKGL3Eo01L-tIxhDKVG98RFc8i5_p2XcRLxn8RYIiy10f5QMIa9cQrV8vRPJwg/exec"; //ใส่_Google_Apps_Script_Web_App_URL_ที่นี่
        let calendar;

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", username: u, password: p })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    initCalendar();
                } else {
                    alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
                }
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.content-tab').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function initCalendar() {
            var calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'th',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                editable: true,
                selectable: true,
                select: function(info) {
                    var title = prompt('ชื่อกิจกรรม:');
                    if (title) {
                        fetch(WEB_APP_URL, {
                            method: "POST",
                            body: JSON.stringify({ action: "saveEvent", title: title, start: info.startStr, end: info.endStr, category: 'General' })
                        }).then(() => {
                            calendar.addEvent({ title: title, start: info.start, end: info.end, allDay: info.allDay });
                        });
                    }
                }
            });
            calendar.render();
        }

        function changeLanguage(lang) {
            if(calendar) {
                calendar.setOption('locale', lang);
            }
        }

        function saveCategory() {
            const name = document.getElementById('catName').value;
            const color = document.getElementById('catColor').value;
            if(!name) return alert("กรุณากรอกชื่อหมวดหมู่");
            
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "saveCategory", name: name, color: color })
            }).then(res => res.json()).then(data => {
                if(data.status === "success") {
                    alert("บันทึกหมวดหมู่สำเร็จ");
                    document.getElementById('catName').value = "";
                }
            });
        }
    </script>
</body>
</html>
